.vortex-container {
    position: fixed;
    top: 55%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 100%;
    height: 500px;
    perspective: 1000px;
    z-index: 500;
    pointer-events: none;
}
.vortex-scene {
    width: 100%;
    height: 100%;
    position: relative;
    transform-style: preserve-3d;
    pointer-events: auto;
}
.vortex-group {
    position: absolute;
    width: 100%;
    height: 100%;
    transform-style: preserve-3d;
}
.vortex-label {
    position: absolute;
    left: 50%;
    top: 5%;
    transform: translate(-50%, -50%);
    font-size: 52px;
    letter-spacing: 4px;
    opacity: 0.3;
    text-transform: uppercase;
    pointer-events: none;
    white-space: nowrap;
    font-weight: 700;
    will-change: transform;
}
.vortex-card {
    position: absolute;
    left: 50%;
    top: 50%;
    margin-left: -90px;
    margin-top: -140px;
    width: 180px;
    height: 280px;
    transform-style: preserve-3d;
    cursor: default;
    will-change: transform, opacity;
}
.card-face {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    background: rgba(20, 20, 25, 0.8);
    border: 1px solid rgba(255, 255, 255, 0.4);
    backdrop-filter: blur(10px);
    overflow: hidden;
    transition: border-color 0.3s ease, box-shadow 0.3s ease, background 0.3s ease;
}
.card-face::before {
    display: none;
}
.vortex-card:hover .card-face {
    background: rgba(20, 20, 25, 0.8);
    border-color: rgba(255, 255, 255, 0.4);
    box-shadow: none;
}
.card-image {
    width: 100%;
    height: 200px;
    object-fit: cover;
    display: block;
    filter: none;
    transition: filter 0.3s ease;
}
.vortex-card:hover .card-image {
    filter: none;
}
.card-image-placeholder {
    width: 100%;
    height: 200px;
    background: linear-gradient(180deg, rgba(255,255,255,0.03) 0%, rgba(255,255,255,0.01) 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 8pt;
    color: rgba(255,255,255,0.15);
    letter-spacing: 2px;
}
.card-label {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 16px;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: #fff;
    background: transparent;
    transition: all 0.3s ease;
}
.vortex-card:hover .card-label {
    background: transparent;
    color: #fff;
}
.vortex-card::after {
    content: '';
    position: absolute;
    top: 50%; left: 50%;
    width: 100%; height: 100%;
    transform: translate(-50%, -50%);
    background: radial-gradient(ellipse at center, rgba(255,255,255,0.06) 0%, transparent 70%);
    opacity: 0;
    transition: opacity 0.3s;
    pointer-events: none;
}
.vortex-card:hover::after { opacity: 0; }

@media (max-width: 900px) {
    .vortex-container { height: 400px; }
    .vortex-card { width: 140px; height: 220px; margin-left: -70px; margin-top: -110px; }

<script>
(function() {
    const container = document.getElementById('vortexContainer');
    if (!container) return;

    const cards = Array.from(container.querySelectorAll('.vortex-card'));
    let swayTime = 0;

    function positionCards() {
        const total = cards.length;
        const isMobile = window.innerWidth <= 600;
        const spacing = isMobile ? Math.min(76, (window.innerWidth - 30) / Math.max(1, total - 1)) : 190;
        cards.forEach((card, i) => {
            card.dataset.index = i;
            card.style.left = '50%';
            card.style.transform = `translateX(${(i - (total - 1) / 2) * spacing}px)`;
            card.style.zIndex = String(total - i);
            card.style.opacity = '1';
            card.style.pointerEvents = 'none';
        });
    }

    cards.forEach(card => {
        card.style.pointerEvents = 'none';
    });

    function animate() {
        swayTime += 0.02;
        cards.forEach((card, i) => {
            const swayY = Math.sin(swayTime + i * 0.8) * 8;
            card.style.marginTop = `${(window.innerWidth <= 600 ? -60 : window.innerWidth <= 900 ? -110 : -140) + swayY}px`;
            card.style.transform = `translateX(${(i - (cards.length - 1) / 2) * (window.innerWidth <= 600 ? Math.min(76, (window.innerWidth - 30) / Math.max(1, cards.length - 1)) : 190)}px)`;
        });
        requestAnimationFrame(animate);
    }

    positionCards();
    window.addEventListener('resize', positionCards);
    animate();
})();
</script>

<script>
(function() {
    'use strict';

    var QUOTES = [
        'we are made of star-stuff contemplating the stars',
        'between the wish and the thing the world lies waiting',
        'all the atoms in your body were forged in the hearts of dying stars',
        'the cosmos is within us — we are a way for the universe to know itself',
        'somewhere something incredible is waiting to be known',
        'even the darkness has arms',
    ];

    var bgMusic=document.getElementById('bgMusic');
    var tracks=['audio/1.mp3','audio/2.mp3','audio/3.mp3'], currentTrack=0;
    var player=document.getElementById('audioPlayer'), play=document.getElementById('playTrack'), prev=document.getElementById('prevTrack'), next=document.getElementById('nextTrack'), line=document.getElementById('audioLine'), progress=document.getElementById('audioProgress'), name=document.getElementById('audioTrackName');
    function loadTrack(i,auto){currentTrack=(i+tracks.length)%tracks.length;bgMusic.src=tracks[currentTrack];bgMusic.load();name.textContent=(currentTrack+1)+'.mp3';progress.style.width='0%';if(auto) bgMusic.play().catch(function(){});}
    function setPlaying(){play.textContent='▶';}
    play.onclick=function(){if(bgMusic.paused) bgMusic.play().catch(function(){});else bgMusic.pause();setPlaying();};
    prev.onclick=function(){loadTrack(currentTrack-1,true);setPlaying();}; next.onclick=function(){loadTrack(currentTrack+1,true);setPlaying();};
    bgMusic.ontimeupdate=function(){if(bgMusic.duration)progress.style.width=(bgMusic.currentTime/bgMusic.duration*100)+'%';};
    bgMusic.onended=function(){loadTrack(currentTrack+1,true);setPlaying();};
    line.onclick=function(e){if(!bgMusic.duration)return;var r=line.getBoundingClientRect();bgMusic.currentTime=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width))*bgMusic.duration;};
    loadTrack(0,false);
    setTimeout(function(){ bgMusic.play().then(setPlaying).catch(function(){}); }, 500);

    (function() {
        var el = document.getElementById('text');
        if (!el) return;

        var words = quote.split(' ');
        el.innerHTML = words.map(function(w) {
            return '<span style="opacity:0;visibility:hidden;">' + w + '</span>';
        }).join(' ');
        var spans = el.querySelectorAll('span');
        spans.forEach(function(span, i) {
            setTimeout(function() {
                gsap.to(span, { autoAlpha: 1, duration: 0.8, ease: 'power2.out' });
            }, 2000 + i * 200);
        });
    })();

    (function() {
        var title = document.querySelector('.pageTitle');
        if (!title) return;
        setTimeout(function() {
            gsap.to(title, { opacity: 1, duration: 1.5, ease: 'power2.out' });
        }, 500);
    })();

    var currentProfile = null;
    var landingEls = [
        document.querySelector('.portfolioWorks'),
        document.querySelector('.vulgateClementine'),
        document.querySelector('.pageTitle'),
        document.getElementById('landing-np'),
    ];
    var backBtn = document.getElementById('backBtn');

    window.showProfile = function(who) {
        var profileEl = document.getElementById('profile-' + who);
        if (!profileEl || currentProfile) return;
        currentProfile = who;

        landingEls.forEach(function(el) {
            if (el) {
                gsap.to(el, { autoAlpha: 0, duration: 0.6, ease: 'power2.inOut', onComplete: function() {
                    el.classList.add('hidden-section');
                }});
            }
        });

        setTimeout(function() {
            profileEl.classList.add('active');
            gsap.fromTo(profileEl, { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.8, ease: 'power2.out' });
            backBtn.classList.add('visible');
            gsap.to(backBtn, { autoAlpha: 1, duration: 0.5, ease: 'power2.out' });
        }, 600);

        history.pushState(null, '', '#' + who);
    };

    function showLanding() {
        if (!currentProfile) return;
        var profileEl = document.getElementById('profile-' + currentProfile);

        gsap.to(profileEl, { autoAlpha: 0, duration: 0.5, ease: 'power2.inOut', onComplete: function() {
            profileEl.classList.remove('active');
        }});
        gsap.to(backBtn, { autoAlpha: 0, duration: 0.3, ease: 'power2.out', onComplete: function() {
            backBtn.classList.remove('visible');
        }});

        setTimeout(function() {
            landingEls.forEach(function(el) {
                if (el) {
                    el.classList.remove('hidden-section');
                    gsap.to(el, { autoAlpha: 1, duration: 0.8, ease: 'power2.out' });
                }
            });
        }, 400);

        currentProfile = null;
        history.pushState(null, '', window.location.pathname);
    }

    backBtn.addEventListener('click', showLanding);

    window.addEventListener('popstate', function() {
        var hash = window.location.hash.replace('#', '');
        if (/^person[1-5]$/.test(hash)) {
            showProfile(hash);
        } else if (currentProfile) {
            showLanding();
        }
    });

    (function() {
        var hash = window.location.hash.replace('#', '');
        if (/^person[1-5]$/.test(hash)) {
            setTimeout(function() { showProfile(hash); }, 1500);
        }
    })();

    var toast = null;
    function showToast(text) {
        if (!toast) {
            toast = document.createElement('div');
            toast.className = 'copy-toast';
            document.body.appendChild(toast);
        }
        toast.textContent = text;
        toast.classList.add('show');
        setTimeout(function() { toast.classList.remove('show'); }, 1800);
    }

    document.querySelectorAll('.copy-link').forEach(function(link) {
        link.addEventListener('click', function(e) {
            e.preventDefault();
            var key = link.getAttribute('data-copy');
            var text = '';
            if (key === 'otis_discord') text = DISCORD_OTIS;
            if (key === 'sev_discord') text = DISCORD_SEV;
            if (!text) return;

            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).then(function() { showToast('copied: ' + text); });
            } else {
                var tmp = document.createElement('textarea');
                tmp.value = text; tmp.style.position = 'fixed'; tmp.style.opacity = '0';
                document.body.appendChild(tmp); tmp.select();
                document.execCommand('copy'); document.body.removeChild(tmp);
                showToast('copied: ' + text);
            }
        });
    });

    document.addEventListener('contextmenu', function(e) { e.preventDefault(); });
})();

    (function() {
        var intro = document.getElementById('sorrow-intro');
        if (!intro) return;
        function enterSite() {
            intro.classList.add('hidden');
            document.body.classList.add('sorrow-entered');
            document.getElementById('audioPlayer').classList.add('visible');
            bgMusic.play().then(setPlaying).catch(function(){});
            document.body.style.overflow = '';
            intro.removeEventListener('click', enterSite);
        }
        intro.addEventListener('click', enterSite);
    })();
</script>

</body></html>
